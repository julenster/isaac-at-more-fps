; Isaac at More FPS settings (optional: the mod works without this file)

[morefps]
; 1 = mod on, 0 = mod off (without uninstalling)
enabled=1

; FPS limit. 0 = no limit (VSync / your monitor's refresh rate decides).
; Examples: 144, 165, 240. Values under 60 are ignored.
max_fps=0

; 1 = write FPS and logic rate to morefps.log every 2 seconds (for troubleshooting)
log_fps=0
