name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW (32-bit)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 zip
      - name: Build
        run: make dist
      - name: Checksums
        run: cd dist && sha256sum isaac-highfps/winmm.dll isaac-highfps.zip | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: isaac-highfps
          path: |
            dist/isaac-highfps.zip
            dist/SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/isaac-highfps.zip
            dist/isaac-highfps/winmm.dll
            dist/SHA256SUMS.txt
